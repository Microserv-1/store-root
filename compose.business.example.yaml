# Immutable image override example for B's services in production/staging Compose deployments.
services:
  product:
    image: ${PRODUCT_IMAGE:?Set PRODUCT_IMAGE to B's immutable image}
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql+psycopg://store:${POSTGRES_PASSWORD}@postgres:5432/store
      REDIS_URL: redis://redis:6379/0
    networks: [backend]
  order:
    image: ${ORDER_IMAGE:?Set ORDER_IMAGE to B's immutable image}
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql+psycopg://store:${POSTGRES_PASSWORD}@postgres:5432/store
      PRODUCT_URL: http://product:8000
      EXCHANGE_URL: http://exchange:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    networks: [backend]
  exchange:
    image: ${EXCHANGE_IMAGE:?Set EXCHANGE_IMAGE to B's immutable Python image}
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks: [backend]
