# Local Kubernetes manifests for Redis (Product cache) and RabbitMQ (Order async messaging).
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: store}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ['--appendonly', 'yes']
        ports: [{containerPort: 6379}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          exec: {command: [redis-cli, ping]}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: store}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: store}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-alpine
        ports: [{containerPort: 5672}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 512Mi}
        readinessProbe:
          exec: {command: [rabbitmq-diagnostics, -q, ping]}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: store}
spec:
  selector: {app: rabbitmq}
  ports: [{port: 5672, targetPort: 5672}]
