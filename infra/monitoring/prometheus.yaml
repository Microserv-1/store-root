global:
  scrape_interval: 5s
scrape_configs:
  - job_name: account
    static_configs: [{targets: ['account:8000']}]
  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ['auth:8000']}]
  - job_name: gateway
    static_configs: [{targets: ['gateway:8000']}]
  - job_name: product
    static_configs: [{targets: ['product:8000']}]
  - job_name: order
    static_configs: [{targets: ['order:8000']}]
  - job_name: exchange
    static_configs: [{targets: ['exchange:8000']}]
