AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Jenkins agent identity; operator separately grants namespace-scoped EKS access
Parameters:
  ClusterName: {Type: String, Default: microserv-store}
  CertificateArn: {Type: String, AllowedPattern: 'arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+'}
Resources:
  JenkinsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DescribeTargetCluster
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
              - Effect: Allow
                Action: [eks:DescribeClusterVersions, ec2:DescribeSubnets, ec2:DescribeRouteTables]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Ref CertificateArn
      Tags: [{Key: project, Value: microserv-store}]
  JenkinsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref JenkinsRole]
Outputs:
  RoleArn: {Value: !GetAtt JenkinsRole.Arn}
  InstanceProfile: {Value: !Ref JenkinsInstanceProfile}
